name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Determine version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: go test ./...
      - name: Build CLI binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/lucyna-aqu/mailbox-tunnel/tunnel.Version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/mailbox-tunnel-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/mailbox-tunnel-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/mailbox-tunnel-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/*

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: Determine version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Test & build Windows desktop app
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          go test ./...
          mkdir -p ../dist
          LDFLAGS="-s -w -H windowsgui -X main.updateRepo=${REPO} -X github.com/lucyna-aqu/mailbox-tunnel/tunnel.Version=${VERSION}"
          go build -tags desktop,production -trimpath -ldflags="$LDFLAGS" -o ../dist/mailbox-tunnel-desktop-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-binary
          path: dist/*

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: mobile/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Determine version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - name: Build Go Android library
        working-directory: mobile
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p ../android/app/libs
          gomobile bind -target=android/arm64,android/arm -androidapi 24 -trimpath -ldflags="-s -w -X github.com/lucyna-aqu/mailbox-tunnel/tunnel.Version=${VERSION}" -javapkg app.mailboxtunnel -o ../android/app/libs/core.aar .
      - name: Copy shared web UI
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r desktop/frontend/dist/. android/app/src/main/assets/web/
      - name: Build APK
        working-directory: android
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ../dist
          if [ -n "$RELEASE_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$RELEASE_KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/mailbox-tunnel-android.apk
          else
            if [ -n "$DEBUG_KEYSTORE" ]; then
              mkdir -p ~/.android
              echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            fi
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/mailbox-tunnel-android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*

  publish:
    needs: [cli, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="## Downloads
          - **Windows Desktop GUI:** \`mailbox-tunnel-desktop-windows-amd64.exe\`
          - **Android VPN App:** \`mailbox-tunnel-android.apk\`
          - **CLI / Node Binaries:** \`mailbox-tunnel-linux-amd64\`, \`mailbox-tunnel-linux-arm64\`, \`mailbox-tunnel-windows-amd64.exe\`

          > **Note for Windows:** Unsigned open-source builds may show a SmartScreen prompt; click **More info → Run anyway** (all binaries are built reproducibly via GitHub Actions and verifiable via \`SHA256SUMS.txt\`)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "Mailbox Tunnel $TAG" --notes "$NOTES"
          fi
