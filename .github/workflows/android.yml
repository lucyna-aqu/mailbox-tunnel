name: android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: mobile/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - name: Build the Go library
        working-directory: mobile
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          gomobile bind -target=android/arm64,android/arm -androidapi 24 -trimpath -ldflags="-s -w" -javapkg app.mailboxtunnel -o core.aar .
          ls -la core.aar
      - uses: actions/upload-artifact@v4
        with:
          name: core-aar
          path: mobile/core.aar
