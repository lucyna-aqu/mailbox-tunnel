name: android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: mobile/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - name: Build the Go library
        working-directory: mobile
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p ../android/app/libs
          gomobile bind -target=android/arm64,android/arm -androidapi 24 -trimpath -ldflags="-s -w" -javapkg app.mailboxtunnel -o ../android/app/libs/core.aar .
      - name: Copy the shared interface
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r desktop/frontend/dist/. android/app/src/main/assets/web/
      - name: Build the APK
        working-directory: android
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$RELEASE_KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../mailbox-tunnel.apk
          else
            echo "::notice::Release keystore secrets not set; falling back to debug APK."
            if [ -n "$DEBUG_KEYSTORE" ]; then
              mkdir -p ~/.android
              echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            fi
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../mailbox-tunnel.apk
          fi
          sha256sum ../mailbox-tunnel.apk > ../mailbox-tunnel.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mailbox-tunnel-apk
          path: |
            mailbox-tunnel.apk
            mailbox-tunnel.apk.sha256
