name: tunnel node

on:
  workflow_dispatch:
    inputs:
      session:
        description: Session name (must match the client)
        required: true
        default: gha1
      minutes:
        description: How long to keep the node running
        required: true
        default: "25"

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o mailbox-tunnel .
      - name: Run node
        env:
          MAILBOX_DEPLOYMENT_ID: ${{ secrets.MAILBOX_DEPLOYMENT_ID }}
          MAILBOX_AUTH_KEY: ${{ secrets.MAILBOX_AUTH_KEY }}
        run: ./mailbox-tunnel -mode node -google-ip= -session "${{ inputs.session }}" -duration "${{ inputs.minutes }}m"
