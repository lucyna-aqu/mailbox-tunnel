plugins {
    id "com.android.application"
}

android {
    namespace "app.mailboxtunnel"
    compileSdk 35

    defaultConfig {
        applicationId "app.mailboxtunnel"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Built from ../mobile with gomobile bind; see .github/workflows/android.yml.
    implementation files("libs/core.aar")
}
